name: Build CV (LaTeX) + Next.js Export

# Fork sin deploy: este repo compila para verificar, no publica.
# El sitio lo publica el upstream (Noothowl/CV-Portfolio).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    name: Build CV and static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web deps
        working-directory: apps/web
        run: npm install

      # Compile LaTex
      - name: Build CV (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: martinchipoco-cv.tex
          working_directory: .
          latexmk_shell_escape: true
          latexmk_use_xelatex: true

      - name: Copy CV into web/public
        run: |
          mkdir -p apps/web/public
          cp ./martinchipoco-cv.pdf apps/web/public/cv.pdf

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /CV-Portfolio
          NEXT_PUBLIC_SITE_URL: https://fcarvajalbrown.github.io/CV-Portfolio
        working-directory: apps/web
        run: npm run build
